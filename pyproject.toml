[project]
name = "vera"
version = "0.0.1"
description = "Verifiable, Economical Research Agents: judge library, integrity auditor, budgeted research agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.7",
]

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
]
corpus = [
    "pymupdf>=1.28.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
t3 = [
    "docling>=2.131.0",
    "pymupdf4llm>=1.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tmp"]  # untracked scratch space: sandbox working directories, one-off probes

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# tools/checks/*.py run as scripts and import their sibling helper module
known-local-folder = ["_common"]
