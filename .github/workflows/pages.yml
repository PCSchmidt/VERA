name: Pages showcase

# Builds the read-only showcase (scripts/build_pages.py) from files in this repository and publishes it to GitHub Pages.
# It contains no key, no server and nothing that runs a model.
on:
  push:
    branches: [main]
    paths:
      - "vera/app/static/**"
      - "vera/app/facts.py"
      - "vera/app/pdf.py"
      - "vera/app/fonts/**"
      - "data/app/**"
      - "data/walkthrough/**"
      - "data/literature/**"
      - "data/topics/**"
      - "data/results/rubric4_chris.json"
      - "docs/results/runs4/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run python scripts/build_pages.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
