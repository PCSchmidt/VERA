# VERA gate DAG. Add the next increment's gates at each increment review;
# don't pre-build gates for work that isn't planned yet. Passed gates stay.
#
# Increment 0 (all passed 2026-09-30):
#   confirmed ─► scaffold_ready ─► corpus_fetched ─┬─► inventory_verified ─┐
#   (human)       (automated)       (automated)     │   (human)             ├─► incr0_review
#                                                   └─► parser_decided ─────┘   (human + Evaluator)
#
# Increment 1 (P2 minimum viable judge; SPEC.md):
#   incr0_review ─► incr1_scoped ─► judge_core_ready ─┬─► backends_live ──────┐
#                   (human)          (automated)      ├─► benchmark_labeled ──┼─► benchmark_run ─┐
#                                                     │   (human)             │   (automated)    ├─► trades_decided_1 ─► incr1_review
#                                                     └─► graph_ready ────────┴──────────────────┘   (human)             (human + Evaluator)
#                                                         (automated)
#
# Human approval gates are approved by Chris in his own terminal:
#   bash scripts/gate-engine.sh mark-passed <gate> --approve "<approval_token>"
# Every pre-hook exits 2 to block. VERA's checks: tools/checks/*.py via scripts/gate-*.sh.

version: "1.0"

project:
  name: "vera"
  recipe: "custom"
  description: "Verifiable, Economical Research Agents. Increment 0: know your data"

gates:
  - id: confirmed
    label: "Scope confirmed"
    type: human_approval
    required: true
    approval_token: "CONFIRMED"
    requires: []
    requires_artifacts:
      - CONTRACT.md
      - SPEC.md
      - docs/01-conops.md
      - docs/02-requirements.md
      - docs/03-interfaces.md
      - docs/07-increments.md
    hooks:
      pre:
        - validate-contract.sh      # Meridian: Purpose + Scope sections present
        - validate-spec.sh          # Meridian: SPEC.md is structured
        - gate-spend-ceiling.sh     # ConOps §4 ceiling is a dollar amount, not TBD

  - id: scaffold_ready
    label: "Repo scaffold and v0.1 schemas"
    type: automated
    required: true
    requires:
      - confirmed
    requires_artifacts:
      - pyproject.toml
      - vera/schemas/version.py
    hooks:
      pre:
        - gate-tests.sh             # ruff + pytest (schema round-trip tests)
        - gate-schema-version.sh    # code SCHEMA_VERSION == docs/03 version

  - id: corpus_fetched
    label: "Corpus discovered and downloaded with provenance"
    type: automated
    required: true
    requires:
      - scaffold_ready
    requires_artifacts:
      - scripts/discover_corpus.py
      - scripts/fetch_corpus.py
      - data/corpus_discovery.json
      - data/provenance.jsonl
    hooks:
      pre:
        - gate-tests.sh
        - gate-discovery.sh         # source + count recorded; mismatch explained
        - gate-provenance.sh        # FND-C-02: hashes match, nothing in data/raw committed
        - gate-traceability.sh      # every due T-requirement has a test_<ID>_ test

  - id: inventory_verified
    label: "Inventory complete and spot-checked by a human"
    type: human_approval
    required: true
    approval_token: "INVENTORY VERIFIED"
    requires:
      - corpus_fetched
    requires_artifacts:
      - data/corpus_inventory.csv
      - data/inventory_spotcheck.csv
    hooks:
      pre:
        - gate-inventory.sh         # no blanks/template rows; every sampled row has a human verdict

  - id: parser_decided
    label: "PDF parser chosen (trade T3)"
    type: human_approval
    required: true
    approval_token: "PARSER DECIDED"
    requires:
      - corpus_fetched
    hooks:
      pre:
        - gate-parser-decided.sh    # T3 decided, with **Decision:** and **Reverse if:**

  - id: incr0_review
    label: "Increment 0 review"
    type: human_approval
    required: true
    approval_token: "INCREMENT 0 COMPLETE"
    requires:
      - inventory_verified
      - parser_decided
    requires_artifacts:
      - docs/reviews/incr-0.md
    hooks:
      pre:
        - gate-tests.sh
        - gate-traceability.sh
        - run-evaluator.sh          # Meridian: independent Evaluator verdict on the review

  # ── Increment 1: P2 minimum viable judge ──────────────────────────────────

  - id: incr1_scoped
    label: "Increment 1 scope confirmed"
    type: human_approval
    required: true
    approval_token: "INCREMENT 1 SCOPED"
    requires:
      - incr0_review
    requires_artifacts:
      - SPEC.md
      - CONTRACT.md
      - docs/reviews/incr-0.md
    hooks:
      pre:
        - validate-contract.sh      # Meridian: Purpose + Scope sections present
        - validate-spec.sh          # Meridian: SPEC.md is structured
        - gate-spend-ceiling.sh     # ConOps §4 ceiling is a dollar amount

  - id: judge_core_ready
    label: "Ledger, question parsing and router, tested offline"
    type: automated
    required: true
    requires:
      - incr1_scoped
    requires_artifacts:
      - vera/ledger/__init__.py
      - vera/judge/__init__.py
    hooks:
      pre:
        - gate-tests.sh             # ruff + pytest (FND-F-01, JDG-F-01..03 tests)
        - gate-schema-version.sh    # traceability runs at benchmark_run: it covers the whole increment
        - gate-vendor-imports.sh    # FND-C-01: no vendor SDK outside vera/backends/

  - id: backends_live
    label: "Two backends run through the ledger (JDG-F-04 demo)"
    type: automated
    required: true
    requires:
      - judge_core_ready
    requires_artifacts:
      - data/ledger/smoke.jsonl
    hooks:
      pre:
        - gate-ledger.sh            # >= 2 backends, all fields, spend <= $1.00

  - id: graph_ready
    label: "LangGraph helpers and checkpoint/resume"
    type: automated
    required: true
    requires:
      - judge_core_ready
    requires_artifacts:
      - vera/graph/__init__.py
    hooks:
      pre:
        - gate-tests.sh             # includes FND-F-02 kill-and-resume test

  - id: benchmark_labeled
    label: "Benchmark items built, split fixed, labels checked by Chris"
    type: human_approval
    required: true
    approval_token: "BENCHMARK LABELED"
    requires:
      - judge_core_ready
    requires_artifacts:
      - data/benchmark/items.jsonl
      - data/benchmark/label_check.csv
    hooks:
      pre:
        - gate-benchmark-items.sh   # 3 tasks, 3 question types, split hash, >= 3 human checks per task

  - id: benchmark_run
    label: "Benchmark run and threshold sweep"
    type: automated
    required: true
    requires:
      - backends_live
      - benchmark_labeled
    requires_artifacts:
      - data/benchmark/results.json
      - docs/figures/threshold_curve.png
    hooks:
      pre:
        - gate-tests.sh
        - gate-traceability.sh      # every due T-requirement has a test_<ID>_ test (whole increment)
        - gate-benchmark-results.sh # metrics per backend/threshold, test hash unchanged, spend <= $8.00

  - id: trades_decided_1
    label: "T1 and T2 decided; JDG-P targets set"
    type: human_approval
    required: true
    approval_token: "T1 T2 DECIDED"
    requires:
      - benchmark_run
      - graph_ready
    hooks:
      pre:
        - gate-trades-incr1.sh      # T1 and T2 decided (Scores, Decision, Reverse if)

  - id: incr1_review
    label: "Increment 1 review"
    type: human_approval
    required: true
    approval_token: "INCREMENT 1 COMPLETE"
    requires:
      - trades_decided_1
    requires_artifacts:
      - docs/reviews/incr-1.md
    hooks:
      pre:
        - gate-tests.sh
        - gate-traceability.sh
        - run-evaluator.sh          # independent Evaluator verdict on the review

  # ── Increment 2: thin loop on TreeHFD (SPEC.md) ───────────────────────────
  # The DAG is drawn in SPEC.md; each gate was added with the check script it needs:
  # incr2_scoped, run_core_ready, design_trades_decided, sandbox_ready, stages_ready,
  # audit_ready, trades_decided_2, loop_run, judge_retest, incr2_review.

  - id: incr2_scoped
    label: "Increment 2 scope confirmed"
    type: human_approval
    required: true
    approval_token: "INCREMENT 2 SCOPED"
    requires:
      - incr1_review
    requires_artifacts:
      - SPEC.md
      - CONTRACT.md
      - docs/reviews/incr-1.md
    hooks:
      pre:
        - validate-contract.sh      # Meridian: Purpose + Scope sections present
        - validate-spec.sh          # Meridian: SPEC.md is structured
        - gate-spend-ceiling.sh     # ConOps §4 ceiling is a dollar amount

  - id: run_core_ready
    label: "Run spec, per-run ledger, cheap path and budget stop, tested offline"
    type: automated
    required: true
    requires:
      - incr2_scoped
    requires_artifacts:
      - vera/loop/__init__.py
      - vera/loop/stop.py
      - vera/judge/cheap_path.py
    hooks:
      pre:
        - gate-tests.sh             # ruff + pytest (RSH-F-01, RSH-P-01, RSH-F-06 tests)
        - gate-schema-version.sh    # code SCHEMA_VERSION == docs/03 version (0.8)
        - gate-vendor-imports.sh    # FND-C-01 still holds

  - id: design_trades_decided
    label: "T4 sandbox and T5 bibliographic source decided"
    type: human_approval
    required: true
    approval_token: "T4 T5 DECIDED"
    requires:
      - incr2_scoped
    hooks:
      pre:
        - gate-trades-design.sh     # T4 and T5 decided (Scores, Decision, Reverse if)

  - id: sandbox_ready
    label: "Sandbox for generated code (T4: local Docker, FND-F-03)"
    type: automated
    required: true
    requires:
      - design_trades_decided
      - run_core_ready
    requires_artifacts:
      - vera/sandbox/__init__.py
      - docker/sandbox-treehfd/Dockerfile
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-sandbox.sh           # FND-F-03: exec/eval/subprocess only in vera/sandbox/; real-container tests, Docker required

  - id: stages_ready
    label: "Baseline, idea and write-up stages, gated, with a live smoke run (RSH-F-02, RSH-F-03, RSH-F-07)"
    type: automated
    required: true
    requires:
      - run_core_ready
      - sandbox_ready
    requires_artifacts:
      - vera/loop/stages.py
      - vera/loop/graph.py
      - vera/loop/writeup.py
      - docker/sandbox-treehfd/harness.py
      - docs/results/treehfd_baseline_target.json
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite (loop stages, write-up, kill-and-resume on the real graph)
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-loop-smoke.sh        # a live run reached the write-up, every call ledgered, within the debugging cap

  - id: audit_ready
    label: "Minimal P1 final gate: citations and numbers against the run's own logs (AUD-F-03, AUD-F-04, AUD-F-09, RSH-F-05)"
    type: automated
    required: true
    requires:
      - design_trades_decided
      - stages_ready
    requires_artifacts:
      - vera/audit/__init__.py
      - vera/audit/citations.py
      - vera/audit/numbers.py
      - vera/loop/audit_stage.py
      - data/seeded/manifest.csv
      - data/seeded/split.json
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite (audit rules, seeded set offline, loop with the audit stage)
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-seeded-audit.sh      # live seeded-fault evidence: test detection >= 90%, no fail on controls, hash unchanged
        - gate-audit-smoke.sh       # a live run reached the audit with every call ledgered

  - id: trades_decided_2
    label: "T6, T7 and T9 decided (generator comparison run and within its cap)"
    type: human_approval
    required: true
    approval_token: "T6 T7 T9 DECIDED"
    requires:
      - stages_ready
      - audit_ready
    hooks:
      pre:
        - gate-trades-incr2.sh      # T6, T7, T9 decided (Scores, Decision, Reverse if); the comparison is complete and under $4

  - id: loop_run
    label: "One complete end-to-end run inside its budget, with a per-stage cost ledger and an audit report on its own paper"
    type: automated
    required: true
    requires:
      - trades_decided_2
    hooks:
      pre:
        - gate-loop-run.sh          # a runs/loop-* attempt: all stages through the audit, ledger = spend, within $3 / 2 h

  - id: judge_retest
    label: "Judge re-tested on the loop's real gate decisions (T1 reverse-if 1)"
    type: automated
    required: true
    requires:
      - loop_run
    hooks:
      pre:
        - gate-retest.sh            # >= 100 items, test hash unchanged, results with intervals, reference spend <= $1; a failed agreement does not block

  - id: incr2_review
    label: "Increment 2 review"
    type: human_approval
    required: true
    approval_token: "INCREMENT 2 COMPLETE"
    requires:
      - judge_retest
    requires_artifacts:
      - docs/reviews/incr-2.md
    hooks:
      pre:
        - gate-tests.sh
        - gate-traceability.sh
        - gate-dogfood.sh           # an overhead entry for each calendar day a gate passed this increment
        - run-evaluator.sh          # independent Evaluator verdict on the review

  # ── Increment 3: topic front end and literature stage (SPEC.md) ───────────
  # The DAG is drawn in SPEC.md; each gate is added with the check script it needs.
  # Defined so far: incr3_scoped, lit_core_ready, topics_chosen, scoping_ready,
  # retrieval_ready, literature_ready, audit3_ready, trades_decided_3, topic_runs, judge_retest_3, incr3_review.

  - id: incr3_scoped
    label: "Increment 3 scope confirmed"
    type: human_approval
    required: true
    approval_token: "INCREMENT 3 SCOPED"
    requires:
      - incr2_review
    requires_artifacts:
      - SPEC.md
      - CONTRACT.md
      - docs/reviews/incr-2.md
    hooks:
      pre:
        - validate-contract.sh      # Meridian: Purpose + Scope sections present
        - validate-spec.sh          # Meridian: SPEC.md is structured
        - gate-spend-ceiling.sh     # ConOps §4 ceiling is a dollar amount

  - id: lit_core_ready
    label: "Schemas 0.9, multi-verdict stage results, dogfood check, upstream draft, tested offline"
    type: automated
    required: true
    requires:
      - incr3_scoped
    requires_artifacts:
      - vera/schemas/literature.py
      - docs/upstream/treehfd-predict-nondeterministic.md
    hooks:
      pre:
        - gate-tests.sh             # ruff + pytest (schemas 0.9, StageResult.gates, check_dogfood)
        - gate-schema-version.sh    # code SCHEMA_VERSION == docs/03 version (0.9)
        - gate-vendor-imports.sh    # FND-C-01 still holds

  - id: topics_chosen
    label: "Three topics and their key-paper lists fixed and hashed before any retrieval"
    type: human_approval
    required: true
    approval_token: "TOPICS CHOSEN"
    requires:
      - incr3_scoped
    requires_artifacts:
      - data/topics/manifest.json
    hooks:
      pre:
        - gate-topics.sh            # 3 topics (harness / no harness / non-empirical), >= 6 key papers, hashes match

  - id: scoping_ready
    label: "Scoping stage and the confirmation pause, tested offline; the three topics scoped live and confirmed (RSH-F-08)"
    type: automated
    required: true
    requires:
      - lit_core_ready
      - topics_chosen
    requires_artifacts:
      - vera/literature/scoping.py
      - vera/literature/graph.py
      - scripts/confirm_scope.py
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite (test_RSH_F_08_*)
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-scoping.sh           # 3 confirmed questions (named person, time), only scoping spend before confirmation, <= $0.25 each

  - id: retrieval_ready
    label: "Retrieval and relevance screen tested offline; the three topics retrieved live, key-paper recall measured, screen checked by the user"
    type: automated
    required: true
    requires:
      - scoping_ready
    requires_artifacts:
      - vera/literature/retrieval.py
      - vera/literature/stages.py
      - vera/literature/expansion.py
      - docs/results/retrieval_recall.md
      - data/retrieval/relevance_check.csv
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite (retrieval, expansion, reading, offline)
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-retrieval.sh         # 3 retrieval logs, recall report, 15 user-checked relevance verdicts per topic, ledger within the cap

  - id: literature_ready
    label: "Reading and synthesis: a literature section per topic in which every claim carries a quote found in its source (RSH-F-09)"
    type: automated
    required: true
    requires:
      - retrieval_ready
    requires_artifacts:
      - vera/literature/reading.py
      - vera/literature/synthesis.py
      - vera/literature/synthesis_stage.py
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite (test_RSH_F_09_*)
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-literature.sh        # 3 sections: quotes verbatim in the sources, nothing cited that was not retrieved

  - id: audit3_ready
    label: "Audit v2 tested once on a split fixed before the run, with the audit's source frozen (AUD-F-10)"
    type: automated
    required: true
    requires:
      - literature_ready
    requires_artifacts:
      - vera/audit/seeded_v2.py
      - scripts/run_seeded_v2.py
      - data/seeded_v2/results_test.json
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-seeded-v2.sh         # test hash recomputed, frozen audit hash equals the run's and the current source, intervals reported

  - id: trades_decided_3
    label: "T3, T5, T7 and T10 decided from this increment's measurements"
    type: human_approval
    required: true
    approval_token: "T3 T5 T7 T10 DECIDED"
    requires:
      - audit3_ready
    hooks:
      pre:
        - gate-trades-incr3.sh      # T3, T5, T7, T10 decided (Scores, Decision, Reverse if); spend so far within the caps

  - id: topic_runs
    label: "Three topics run to their final stage with costs measured; one carried through the research loop"
    type: automated
    required: true
    requires:
      - trades_decided_3
    requires_artifacts:
      - docs/results/topic_costs.md
      - data/results/topic_costs.json
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-topic-runs.sh        # 3 completed topic runs with audits, parent readings, loop run with every stage, within $8
        - gate-ledger.sh            # every ledger equals its recorded spend; the increment is within its cap

  - id: judge_retest_3
    label: "Judge re-tested on this increment's claims (benchmark and real) and on the loop's new real gate decisions"
    type: automated
    required: true
    requires:
      - topic_runs
    requires_artifacts:
      - data/claim_bench/results.json
      - data/retest3/results.json
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-retest3.sh           # test hashes unchanged, intervals reported, caps kept, every lit.*/loop.* verdict accounted for
        - gate-ledger.sh            # every ledger equals its recorded spend; the increment is within its cap

  - id: incr3_review
    label: "Increment 3 review"
    type: human_approval
    required: true
    approval_token: "INCREMENT 3 COMPLETE"
    requires:
      - judge_retest_3
    requires_artifacts:
      - docs/reviews/incr-3.md
    hooks:
      pre:
        - gate-tests.sh
        - gate-traceability.sh
        - gate-dogfood.sh           # an overhead entry for each calendar day a gate passed since the last review gate
        - run-evaluator.sh          # independent Evaluator verdict on the review

  # ── Increment 4: paper quality and the measured comparison (SPEC.md) ───────
  # The DAG is drawn in SPEC.md; each gate is added with the check script it needs.
  # Defined so far: incr4_scoped, carry_in_ready, topics4_chosen. Still to add: lit2_ready,
  # problem2_ready, protocol_ready, writeup2_ready, audit4_ready, runs4, comparison4,
  # rubric_scored, incr4_review.

  - id: incr4_scoped
    label: "Increment 4 scope confirmed"
    type: human_approval
    required: true
    approval_token: "INCREMENT 4 SCOPED"
    requires:
      - incr3_review
    requires_artifacts:
      - SPEC.md
      - CONTRACT.md
      - docs/reviews/incr-3.md
    hooks:
      pre:
        - validate-contract.sh      # Meridian: Purpose + Scope sections present
        - validate-spec.sh          # Meridian: SPEC.md is structured
        - gate-spend-ceiling.sh     # ConOps §4 ceiling is a dollar amount

  - id: carry_in_ready
    label: "Rule gates, audit dataset-name fix, complete repair log, per-session overhead rule, schemas 0.10"
    type: automated
    required: true
    requires:
      - incr4_scoped
    requires_artifacts:
      - vera/loop/stages.py
      - tools/checks/check_dogfood.py
      - vera/schemas/research.py
    hooks:
      pre:
        - gate-tests.sh             # ruff + the full suite
        - gate-vendor-imports.sh    # FND-C-01 still holds
        - gate-schema-version.sh    # schemas 0.10 match docs/03 and have a changelog line

  - id: topics4_chosen
    label: "A fresh topic and its key-paper list fixed and hashed before any retrieval for it"
    type: human_approval
    required: true
    approval_token: "TOPICS 4 CHOSEN"
    requires:
      - incr4_scoped
    requires_artifacts:
      - data/topics/manifest.json
    hooks:
      pre:
        - gate-topics4.sh           # 4 topics: the three original, hashes unchanged, plus one fresh, its date before its retrieval
